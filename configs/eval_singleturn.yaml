# Main-table base-model row (scripts/eval.sh): Qwen3-VL-8B-Thinking without tools, one turn of up to 8192 tokens.
use_tool: false
prompt_type: THINK_GENERAL
suffix: _general_t1_8192

env:
  MAX_RESPONSE_TOKENS: 8192
  MAX_ASSISTANT_TURNS: 1
  # no forced final answer for the base row (the tool-using policies use 1)
  EVAL_FORCE_ANSWER: 0
  EVAL_TEMPERATURE: 0.6
  EVAL_TOP_P: 1.0
  EVAL_REPETITION_PENALTY: 1.05

benchmarks:
  videomme: {max_pixels: "224*224", max_frames: 1024}
  charades: {max_pixels: "384*384", max_frames: 256}
  videommmu: {max_pixels: "384*384", max_frames: 256}
  longvideobench: {max_pixels: "224*224", max_frames: 1024}
  mlvu: {max_pixels: "224*224", max_frames: 1024}
  lvbench: {max_pixels: "224*224", max_frames: 1024}
