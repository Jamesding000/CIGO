# Settings shared by the five arms (Qwen3-VL-8B-Thinking, cold start, 300 steps); configs/arm/ sets the rest.
#   python -m verl.trainer.main_ppo --config-path=<repo>/configs --config-name=base arm=cigo trainer.experiment_name=<run>
# Run from the repository root (scripts/train.sh); CIGO_REPO, CIGO_DATA_ROOT, CIGO_MODEL_DIR, CIGO_OUTPUT_DIR set the paths.

defaults:
  # verl's trainer schema
  - ppo_trainer
  - _self_
  # configs/arm/<arm>.yaml, applied on top of this file
  - arm: ???

hydra:
  searchpath:
    - pkg://verl.trainer.config

algorithm:
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false
  # raw reward of a row that breaks a format rule is -violation_penalty
  violation_penalty: 1.0
  # frozen uncertainty probe: the initial policy
  probe_model_path: ${actor_rollout_ref.model.path}
  prefix_replay:
    fresh_root_ratio: 0.5
    capacity: 1600
    ttl_steps: 25
    max_visits: 1
    # tool-call budget, also the replay depth bound
    max_depth: 3
    max_inserts_per_step: 64
    recency_gamma: 0.95
    admission_margin: 512
    max_source_share: 0.5
    std_floor: 1.0e-06
    ur_std_floor: 0.01
    ur_outlier_clip_percentile: 0.05

data:
  train_files:
    - data/train/longvideo_reason.json
    - data/train/cg_bench.json
    - data/train/charades_sta.json
    - data/train/video_r1.json
  # unused (no validation during training), but verl requires it
  val_files: ${data.train_files}
  train_batch_size: 32
  seed: null
  max_prompt_length: 16384
  max_response_length: 16384
  dataloader_num_workers: 0
  custom_cls:
    path: verl/verl/utils/dataset/rl_dataset_video_tool.py
    name: RLHFDatasetVideoTool
  sampler:
    class_path: verl/verl/utils/dataset/pair_shuffle_sampler.py
    class_name: PairShuffleSampler
  multi_turn:
    # frame roots, one per train_files entry (the Video-R1 rows use Charades videos)
    video_base:
      - ${oc.env:CIGO_DATA_ROOT}/longvideo-reason/video_14400frames_fps2
      - ${oc.env:CIGO_DATA_ROOT}/cgbench_mini/video_14400frames_fps2
      - ${oc.env:CIGO_DATA_ROOT}/charades/video_14400frames_fps2
      - ${oc.env:CIGO_DATA_ROOT}/charades/video_14400frames_fps2
    # overview video; every training row carries these values in its own video_kwargs
    video_kwargs:
      max_frames: 256
      max_pixels: 12544

reward:
  # cigo.reward.compute_score, routed by each row's data_source
  custom_reward_function:
    path: pkg://cigo.reward
  reward_manager:
    name: naive

actor_rollout_ref:
  model:
    path: ${oc.env:CIGO_MODEL_DIR}/Qwen3-VL-8B-Thinking
    use_remove_padding: true
    enable_gradient_checkpointing: true
    # fused linear cross-entropy: never materializes the full fp32 logits
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch
  actor:
    freeze_vision_tower: true
    optim:
      lr: 1.0e-05
    ppo_mini_batch_size: 32
    data_loader_seed: 42
    use_kl_loss: true
    kl_loss_coef: 0.01
    kl_loss_type: low_var_kl
    entropy_coeff: 0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    ppo_micro_batch_size_per_gpu: 4
    fsdp_config:
      model_dtype: bf16
      param_offload: true
      optimizer_offload: true
      forward_prefetch: true
  ref:
    log_prob_micro_batch_size_per_gpu: 4
    fsdp_config:
      model_dtype: bf16
      param_offload: true
      forward_prefetch: true
  rollout:
    name: vllm
    tensor_model_parallel_size: 1
    # vLLM sleeps between rollouts, so this memory is free during the update
    gpu_memory_utilization: 0.75
    # max_prompt_length + max_response_length
    max_model_len: 32768
    max_num_batched_tokens: 16384
    log_prob_micro_batch_size_per_gpu: 4
    enforce_eager: false
    disable_log_stats: false
    # group size
    n: 8
    # per-turn cap; equals MAX_RESPONSE_TOKENS in configs/eval/main_table.yaml
    single_turn_response_length: 4096
    engine_kwargs:
      vllm:
        disable_mm_preprocessor_cache: true
        disable_custom_all_reduce: false
    multi_turn:
      enable: true
      # 3 tool calls plus the answering turn
      max_assistant_turns: 4
      tool_config_path: ${oc.env:CIGO_REPO}/verl/verl/tools/config/video_tool_config.yaml
      format: hermes
    agent:
      default_agent_loop: tool_agent
      num_workers: 8

trainer:
  # 4 GPUs, 96 GB each; the batch and memory settings above are sized for this
  n_gpus_per_node: 4
  nnodes: 1
  project_name: cigo
  # the run name (scripts/train.sh passes it)
  experiment_name: ???
  logger:
    - console
    - wandb
  total_training_steps: 300
  critic_warmup: 0
  balance_batch: true
  save_freq: 25
  max_actor_ckpt_to_keep: null
  # no validation during training (test_freq stays -1); evaluation is scripts/eval.sh
  val_before_train: false
  default_local_dir: ${oc.env:CIGO_OUTPUT_DIR}/${trainer.experiment_name}
  rollout_data_dir: ${trainer.default_local_dir}/rollouts

ray_kwargs:
  ray_init:
    runtime_env:
      env_vars:
        # frozen-probe actors, one per GPU
        PROBE_NUM_WORKERS: "4"
